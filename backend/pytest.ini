[pytest]
# Configuration Pytest pour la Bataille Navale

# Répertoires de tests
testpaths = tests

# Pattern des fichiers de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    slow: Tests lents

# Ignorer certains fichiers/dossiers
norecursedirs = .git .tox dist build *.egg __pycache__
